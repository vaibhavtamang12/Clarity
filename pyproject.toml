[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-platform"
version = "0.2.0"
description = "Production-grade enterprise document intelligence & RAG platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis>=5.0",
    "qdrant-client>=1.10",
    "httpx>=0.27",
    "tenacity>=8.3",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
# ML stack kept separate: API-only deployments can skip ~2GB of model deps later.
ml = [
    "sentence-transformers>=3.0",
    "mlflow>=2.15",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------- MyPy
[tool.mypy]
python_version = "3.11"
files = ["app"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mlflow.*", "sentence_transformers.*", "torch.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests (no I/O)",
    "integration: tests requiring external services",
    "retrieval: retrieval benchmark tests",
    "evaluation: evaluation harness tests",
    "slow: long-running tests",
]

# ---------------------------------------------------------------- Coverage
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true